version: 2
sources:
  - name: raw
    schema: gz_raw_data
    description: "Données brutes extraites des systèmes opérationnels."

    tables:
      - name: product
        identifier: raw_gz_product
        description: "Table contenant la liste des produits."
        columns:
          - name: products_id
            description: "Identifiant unique du produit (primary key)."
            tests:
              - not_null
              - unique
          - name: purchse_price
            description: "Prix d'achat du produit, casté en FLOAT64."
            tests:
              - not_null

      - name: sales
        identifier: raw_gz_sales
        description: "Table des ventes, avec une ligne par transaction."
        loaded_at_field: date_date
        freshness:
          warn_after: {count: 1, period: day}
          error_after: {count: 2, period: day}
        columns:
          - name: date_date
            description: "Date de la transaction."
            tests:
              - not_null
          - name: orders_id
            description: "Identifiant unique de la commande (primary key)."
            tests:
              - not_null
          - name: pdt_id
            description: "Identifiant du produit vendu."
            tests:
              - not_null
          - name: revenue
            description: "Revenu généré par la vente."
            tests:
              - not_null
          - name: quantity
            description: "Quantité vendue du produit."
            tests:
              - not_null
        tests: 
            - unique: 
                column_name: concat(orders_id,'-',pdt_id)

      - name: ship
        identifier: raw_gz_ship
        description: "Données de livraison des commandes."
        columns:
          - name: orders_id
            description: "Identifiant unique de la commande (primary key)."
            tests:
              - not_null
              - unique
          - name: shipping_fee
            description: "Frais d'expédition conservés après comparaison avec shipping_fee."
            tests:
              - not_null
          - name: logcost
            description: "Valeur logistique ou supplémentaire sur la livraison."
          - name: ship_cost
            description: "Coût de livraison, casté en FLOAT64."
            tests:
              - not_null

      - name: adwords
        identifier: raw_gz_adwords
        description: "Données des campagnes Google Ads."
        columns: &ad_columns
          - name: date_date
            description: "Date de la campagne."
            tests: [not_null]
          - name: campaign_key
            description: "Identifiant unique de la campagne."
            tests: [not_null]
          - name: camPGN_name
            description: "Nom de la campagne publicitaire."
          - name: ads_cost
            description: "Coût de la campagne (à caster en FLOAT64)."
        tests:
          - unique:
              column_name: "concat(date_date, '-', campaign_key)"

      - name: bing
        identifier: raw_gz_bing
        description: "Données des campagnes Bing Ads."
        columns: *ad_columns
        tests:
          - unique:
              column_name: "concat(date_date, '-', campaign_key)"

      - name: criteo
        identifier: raw_gz_criteo
        description: "Données des campagnes Criteo."
        columns: *ad_columns
        tests:
          - unique:
              column_name: "concat(date_date, '-', campaign_key)"

      - name: facebook
        identifier: raw_gz_facebook
        description: "Données des campagnes Facebook Ads."
        columns: *ad_columns
        tests:
          - unique:
              column_name: "concat(date_date, '-', campaign_key)"